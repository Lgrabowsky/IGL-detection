name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: Versions-Tag (z. B. v0.1.0) – erstellt ein Vorab-Release mit der APK"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # nur für das Anlegen von Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests der Erkennungslogik
        run: ./gradlew -p core test

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - name: Release-Build prüfen (R8)
        run: ./gradlew :app:assembleRelease

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: igl-erkennung-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      # Release: bei einem gepushten Tag „v…“ oder manuell mit „release_tag“.
      - name: Vorab-Release mit APK erstellen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          NOTES: |
            Testversion der IG-L Erkennung zum Ausprobieren.

            **Installation:** `igl-erkennung-*.apk` am Handy herunterladen und öffnen.
            Beim ersten Mal muss die Installation aus dieser Quelle (Browser bzw. Dateien-App) erlaubt werden.
            Voraussetzung: Android 8.0 oder neuer.

            **Hinweise**
            - Debug-Build, signiert mit einem Test-Schlüssel des Build-Servers. Spätere Versionen lassen sich
              eventuell nicht darüber installieren – dann die alte Version vorher deinstallieren.
            - Noch nicht im Straßenverkehr erprobt. Die App ist nur eine Hilfe; maßgeblich ist immer die Beschilderung.
            - Bedienung und Einrichtung: siehe README.
        run: |
          VERSION="${TAG#v}"
          APK="igl-erkennung-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "IG-L Erkennung ${VERSION} (Testversion)" \
            --notes "$NOTES"
