name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests der Erkennungslogik
        run: ./gradlew -p core test

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - name: Release-Build prüfen (R8)
        run: ./gradlew :app:assembleRelease

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: igl-erkennung-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
